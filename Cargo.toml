[package]
name = "rs-qc"
version = "0.1.0"
edition = "2021"

[dependencies]
noodles = { version = "0.78", features = ["bam", "bgzf", "core", "fasta", "sam"] }
clap = { version = "4.4", features = ["derive"] }
rayon = "1.8"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive", "rc"] }
serde_json = "1.0"
csv = "1.3"
bio = "1.4"
smallvec = "1.11"
ahash = "0.8"
regex = "1.10"
bit-vec = "0.6"
indexmap = { version = "2.1", features = ["serde"] }
itertools = "0.12"
log = "0.4"
env_logger = "0.10"
tempfile = "3.8"
kuva = "0.1.6"
flate2 = "1.0"
indicatif = "0.17"
num_cpus = "1.17.0"
bincode = "1.3"
